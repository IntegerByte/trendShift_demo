<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#ffffff" />

    <!--
      This is the single HTML shell Vite serves for every route in this
      single-page app. Per-page <title>/meta/canonical/OG tags are injected
      at runtime by src/components/seo/SEO.jsx (react-helmet-async) — see
      src/data/seo.js for the per-route content.

      Production security headers (CSP, X-Frame-Options, etc.) are applied
      by Apache via public/.htaccess rather than a <meta> tag here, so they
      don't fight Vite's dev-server HMR client script during local dev.
    -->
    <meta name="author" content="TrendShift" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <link rel="icon" type="image/png" sizes="128x128" href="/images/fav.png" />
    <link rel="apple-touch-icon" href="/images/fav.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Rufina:wght@400;700&display=swap" rel="stylesheet" />
    <link
        href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet"
    />

    <!-- Matches src/data/seo.js's "/" entry so the tab title never changes
         after React mounts and react-helmet-async takes over — it's
         already the right value from the very first paint. -->
    <title>TrendShift | Premium Growth & Technology Consulting</title>
</head>

<body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
</body>

</html>
