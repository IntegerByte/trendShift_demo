databases:
  - name: trendshift-db
    plan: free
    databaseName: trendshift
    user: trendshift

services:
  - type: web
    name: trendshift-api
    runtime: python
    plan: free
    rootDir: backend/trendshift-cms-api
    buildCommand: >
      pip install -r requirements.txt &&
      python manage.py collectstatic --noinput &&
      python manage.py migrate &&
      python manage.py seed_trendshift &&
      python manage.py ensure_superuser
    startCommand: gunicorn mycore.wsgi:application
    envVars:
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_ALLOWED_HOSTS
        value: trendshift-api.onrender.com
      - key: DJANGO_CSRF_TRUSTED_ORIGINS
        value: https://trendshift-api.onrender.com
      - key: CORS_ALLOWED_ORIGINS
        value: https://trendshift-frontend.onrender.com
      - key: DATABASE_URL
        fromDatabase:
          name: trendshift-db
          property: connectionString
      # No free-plan Shell access, so the superuser is created/reset via
      # this build-time command instead -- change DJANGO_SUPERUSER_PASSWORD
      # below and redeploy any time to reset a forgotten password. Fill
      # these in on the Render dashboard (Environment tab) rather than
      # committing real values here -- `sync: false` makes Render prompt
      # for them instead of storing them in this file.
      - key: DJANGO_SUPERUSER_USERNAME
        sync: false
      - key: DJANGO_SUPERUSER_EMAIL
        sync: false
      - key: DJANGO_SUPERUSER_PASSWORD
        sync: false
      # Optional Cloudinary storage for persistent media uploads across Render restarts
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false

  - type: web
    name: trendshift-frontend
    runtime: static
    rootDir: frontend/trendshift-cms-web
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        value: https://trendshift-api.onrender.com/api/v1
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
